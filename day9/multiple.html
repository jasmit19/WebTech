<!DOCTYPE html>
<html>
<head>
  <title>Simple Calculator</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    input, select, button { margin: 10px; padding: 8px; font-size: 16px; }
    #result { margin-top: 20px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>

  <input type="number" id="num1" placeholder="First number">
  <select id="operator">
    <option value="+">+</option>
    <option value="-">−</option>
    <option value="*">×</option>
    <option value="/">÷</option>
  </select>
  <input type="number" id="num2" placeholder="Second number">
  <button id="calcBtn">Calculate</button>

  <div id="result"></div>

  <script>
    $('#calcBtn').click(function() {
      try {
        const a = parseFloat($('#num1').val());
        const b = parseFloat($('#num2').val());
        const op = $('#operator').val();
        let res;

        if (isNaN(a) || isNaN(b)) throw "Please enter valid numbers.";

        switch(op) {
          case '+': res = a + b; break;
          case '-': res = a - b; break;
          case '*': res = a * b; break;
          case '/': 
            if (b === 0) throw "Cannot divide by zero.";
            res = a / b; 
            break;
        }

        $('#result').text("Result: " + res);
      } catch (err) {
        $('#result').text("Error: " + err);
      } finally {
        console.log("Calculation attempted.");
      }
    });
  </script>

</body>
</html>
