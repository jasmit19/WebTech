<!DOCTYPE html>
<html>
<head>
  <title>Factorial Calculator</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <label for="numberInput">Enter a number:</label>
  <input type="number" id="numberInput" min="0">
  <p id="result"></p>

  <script>
    function factorial(n) {
      if (n === 0 || n === 1) return 1;
      let result = 1;
      for (let i = 2; i <= n; i++) {
        result *= i;
      }
      return result;
    }

    $('#numberInput').on('change', function() {
      const num = parseInt($(this).val());
      if (!isNaN(num) && num >= 0) {
        $('#result').text('Factorial: ' + factorial(num));
      } else {
        $('#result').text
      }
    });
</script>
</body>
</html>
