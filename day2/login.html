<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: "fantasy font";
            background-color: #819A91; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #ecf0f1;
        }
        .login-box {
            background-color: #91ADC8;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgb(25, 24, 59);
            width: 300px;
            text-align: center;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #576f80;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

         button {
            width: 100%;
            padding: 10px;
            background-color: #576f80;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3a454d;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2><b>Login</b></h2>
        <form>
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
        
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
