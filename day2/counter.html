<!DOCTYPE html>
<html>
<head>
  <title>Simple Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .count1{
        width: 50%;
        height: 40vh;
        border: 1px solid rgb(216, 216, 216);
        padding: 30px;
        border-radius: 20px;
        background-color: #f5ebbe;
    }

    h1 {
      font-size: 2.5em;
      color: #c73232;
    }

    #count {
      font-weight: bold;
      color: #c73232;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #77191f;
      color: white;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #41050a;
    }
  </style>
</head>
<body>
  <div class="count1">
    <h1>Counter: <span id="count">0</span></h1>
    <button onclick="increment()">Increment</button>
    <button onclick="decrement()">Decrement</button>
    <button onclick="reset()">Reset</button>
  </div>

  <script>
    let count = 0;

    function updateDisplay() {
      document.getElementById('count').textContent = count;
    }

    function increment() {
      count++;
      updateDisplay();
    }

    function decrement() {
      count--;
      updateDisplay();
    }

    function reset() {
      count = 0;
      updateDisplay();
    }
  </script>
</body>
</html>
