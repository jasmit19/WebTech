<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="showData()">Data From File</button>
</body>
<script>
    function showdata(){
        let request = new XMLHttpRequest();
        request.open("GET","https://jsonplaceholder.typicode.com/posts/1",true)
        request.send();

        request.onload=function()
        {
            if(this.status==200)
            {
                console.log(this.responseText)
                let dataJson=this.responseText

                let r = JSON.parse(dataJson);
                console.log(r);
            }
        }
    }
</script>
</html>
